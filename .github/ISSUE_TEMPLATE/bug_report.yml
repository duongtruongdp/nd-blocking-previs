name: Bug report
description: Report a reproducible problem in the Web App or desktop Beta.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please remove confidential production material before attaching screenshots or recordings.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0 / Web App
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15, Safari 18 / desktop Beta
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what you clicked or changed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or recordings
      description: Optional. Redact private production information first.
