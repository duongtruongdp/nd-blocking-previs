name: Feature request
description: Suggest a filmmaking, blocking, camera, or previs improvement.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Filmmaking problem
      description: What blocking, framing, camera, or previs task should be easier?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
      description: Describe the result in filmmaker terms.
    validations:
      required: true
