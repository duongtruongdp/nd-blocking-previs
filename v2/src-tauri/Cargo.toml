[package]
name = "nd_blocking_previs"
version = "0.1.0"
description = "ND Blocking & Previs desktop shell"
authors = ["ND"]
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "nd_blocking_previs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-store = "2"
